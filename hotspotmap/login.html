<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartShield — Login</title>
    <meta
      name="description"
      content="Sign in to SmartShield — AI-driven phishing hotspot intelligence dashboard."
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- Animated Background -->
    <div class="auth-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="grid-overlay"></div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
      <div class="auth-card">
        <!-- Branding -->
        <div class="auth-brand">
          <div class="shield-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
              />
            </svg>
          </div>
          <h1>SmartShield</h1>
          <p>Phishing Hotspot Intelligence Platform</p>
        </div>

        <!-- Tab Switcher -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="register">Create Account</button>
        </div>

        <!-- ============ LOGIN FORM ============ -->
        <form id="login-form" class="auth-form active" autocomplete="on">
          <!-- Error -->
          <div class="auth-error" id="login-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span class="error-text"></span>
          </div>

          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 7l-10 7L2 7" />
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
            </div>
          </div>

          <button type="submit" class="btn-auth">
            <span class="btn-text">Sign In to Dashboard</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <!-- ============ REGISTER FORM ============ -->
        <form id="register-form" class="auth-form" autocomplete="on">
          <!-- Error -->
          <div class="auth-error" id="register-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span class="error-text"></span>
          </div>

          <div class="form-group">
            <label for="register-name">Full Name</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="register-name"
                name="name"
                placeholder="John Doe"
                autocomplete="name"
                required
              />
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="register-email">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="register-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 7l-10 7L2 7" />
                </svg>
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="register-password"
                name="password"
                placeholder="Minimum 6 characters"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
              </span>
            </div>
          </div>

          <button type="submit" class="btn-auth">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <div class="auth-footer">
          🛡 Secured by SmartShield Intelligence
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
